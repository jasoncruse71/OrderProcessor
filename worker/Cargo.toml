[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
redis = { version = "0.25", features = ["tokio-comp"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid"] }
serde = { version = "1", features = ["derive"] }
